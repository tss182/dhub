name: Release DHub

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.2.0)'
        required: true
        default: 'v0.2.0'

permissions:
  contents: write

jobs:
  prepare-and-version:
    # Trigger on tag pushes (v*) or manual dispatch
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}
      commit_sha: ${{ steps.version_step.outputs.commit_sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install Wails v3 CLI
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Extract Tag and Version
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          # Strip leading 'v' if present (e.g. v0.1.0 -> 0.1.0)
          VERSION="${TAG_NAME#v}"
          echo "Processing Release for Tag: $TAG_NAME (Version: $VERSION)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Determine target branch (prefer master, fallback to main)
          git fetch origin master:refs/remotes/origin/master 2>/dev/null || true
          git fetch origin main:refs/remotes/origin/main 2>/dev/null || true

          TARGET_BRANCH="master"
          if git show-ref --verify --quiet refs/remotes/origin/master; then
            TARGET_BRANCH="master"
          elif git show-ref --verify --quiet refs/remotes/origin/main; then
            TARGET_BRANCH="main"
          fi
          echo "Target branch: $TARGET_BRANCH"

          # Switch to target branch tracking remote
          git checkout -B "$TARGET_BRANCH" "origin/$TARGET_BRANCH"

          # Update version in build/config.yml under info:
          python3 -c "
          import re
          with open('build/config.yml', 'r') as f:
              content = f.read()
          pattern = r'(info:\s*\n(?:[ \t]+.*\n)*?[ \t]+version:\s*[\"\'\']).*?([\"\'\'][ \t]*(?:#.*)?)'
          new_content = re.sub(pattern, rf'\g<1>${VERSION}\g<2>', content, count=1)
          with open('build/config.yml', 'w') as f:
              f.write(new_content)
          "
          echo "==> Updated build/config.yml with version: $VERSION"

          # Run make update-asset
          make update-asset

          # Configure Git user for automated commit
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          # Check if there are changes to commit
          if git diff --quiet && git diff --staged --quiet; then
            echo "==> No changes detected. Version already up-to-date."
          else
            git add -A
            git commit -m "publish: version ${VERSION}"
            git push origin "$TARGET_BRANCH"
            git tag -f "$TAG_NAME"
            git push origin "$TAG_NAME" --force
          fi

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

  build-linux-windows:
    needs: prepare-and-version
    runs-on: ubuntu-24.04
    env:
      GIT_COMMITTER_NAME: "github-actions[bot]"
      GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
      GOARCH: "amd64"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-and-version.outputs.commit_sha }}

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            gcc \
            libc6-dev \
            libgtk-4-dev \
            libwebkitgtk-6.0-dev \
            nsis \
            rpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install Wails v3 CLI
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install
          cd ..

      - name: Build Linux DEB Package
        run: |
          VERSION="${{ needs.prepare-and-version.outputs.version }}"
          make build:deb
          if [ -f bin/dhub.deb ]; then
            cp bin/dhub.deb "bin/dhub_${VERSION}_linux_amd64.deb"
          fi

      - name: Build Linux RPM Package
        run: |
          VERSION="${{ needs.prepare-and-version.outputs.version }}"
          make build:rpm
          if [ -f bin/dhub.rpm ]; then
            cp bin/dhub.rpm "bin/dhub-${VERSION}-1.x86_64.rpm"
          fi

      - name: Build Windows x86 (amd64) Executable and Installer (User Scope)
        run: |
          VERSION="${{ needs.prepare-and-version.outputs.version }}"
          wails3 task windows:build ARCH=amd64
          cp bin/dhub.exe "bin/dhub-${VERSION}-windows-amd64.exe"
          wails3 task windows:create:nsis:installer ARCH=amd64 INSTALL_SCOPE=user
          if [ -f bin/dhub-amd64-installer.exe ]; then
            cp bin/dhub-amd64-installer.exe "bin/dhub-${VERSION}-windows-amd64-installer.exe"
          else
            echo "Error: bin/dhub-amd64-installer.exe not generated!" >&2
            exit 1
          fi

      - name: Build Windows ARM (arm64) Executable and Installer (User Scope)
        run: |
          VERSION="${{ needs.prepare-and-version.outputs.version }}"
          wails3 task windows:build ARCH=arm64
          cp bin/dhub.exe "bin/dhub-${VERSION}-windows-arm64.exe"
          wails3 task windows:create:nsis:installer ARCH=arm64 INSTALL_SCOPE=user
          if [ -f bin/dhub-arm64-installer.exe ]; then
            cp bin/dhub-arm64-installer.exe "bin/dhub-${VERSION}-windows-arm64-installer.exe"
          else
            echo "Error: bin/dhub-arm64-installer.exe not generated!" >&2
            exit 1
          fi

      - name: Upload Linux & Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows-artifacts
          path: |
            bin/dhub_${{ needs.prepare-and-version.outputs.version }}_linux_amd64.deb
            bin/dhub-${{ needs.prepare-and-version.outputs.version }}-1.x86_64.rpm
            bin/dhub-${{ needs.prepare-and-version.outputs.version }}-windows-amd64.exe
            bin/dhub-${{ needs.prepare-and-version.outputs.version }}-windows-amd64-installer.exe
            bin/dhub-${{ needs.prepare-and-version.outputs.version }}-windows-arm64.exe
            bin/dhub-${{ needs.prepare-and-version.outputs.version }}-windows-arm64-installer.exe
          if-no-files-found: error

  build-macos:
    needs: prepare-and-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-and-version.outputs.commit_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install Wails v3 CLI
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci || npm install
          cd ..

      - name: Build macOS Application (.app bundle and DMG)
        run: |
          VERSION="${{ needs.prepare-and-version.outputs.version }}"
          make build:mac
          if make build:mac:dmg; then
            echo "DMG build completed."
          else
            echo "DMG build skipped/failed, falling back to zipped app bundle."
          fi

          cd bin
          zip -r "dhub-${VERSION}-macos.app.zip" dhub.app
          if [ -f dhub.dmg ]; then
            cp dhub.dmg "dhub-${VERSION}-macos.dmg"
          fi

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            bin/dhub-${{ needs.prepare-and-version.outputs.version }}-macos.app.zip
            bin/dhub-${{ needs.prepare-and-version.outputs.version }}-macos.dmg
          if-no-files-found: warn

  publish-release:
    needs:
      - prepare-and-version
      - build-linux-windows
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Inspect files for release
        run: |
          echo "Artifacts to be published in release:"
          ls -lh dist-release

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-and-version.outputs.tag_name }}
          name: Release ${{ needs.prepare-and-version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-release/*

