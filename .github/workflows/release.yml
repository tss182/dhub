name: Release DHub

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - master
    paths:
      - 'pages/**'
      - '.github/workflows/release.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag to release (e.g. v0.3.5)'
        required: true
        default: 'v0.3.5'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'release-and-pages-${{ github.ref }}'
  cancel-in-progress: false

jobs:
  prepare-version:
    # Only run release pipeline on version tags (v*) or manual workflow_dispatch
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version_step.outputs.version }}
      tag_name: ${{ steps.version_step.outputs.tag_name }}
      commit_sha: ${{ steps.version_step.outputs.commit_sha }}
      target_branch: ${{ steps.version_step.outputs.target_branch }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Tag, Version, and Target Branch
        id: version_step
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.tag }}"
          else
            TAG_NAME="${GITHUB_REF_NAME}"
          fi

          # Strip leading 'v' if present (e.g. v0.3.5 -> 0.3.5)
          VERSION="${TAG_NAME#v}"
          echo "Processing Release for Tag: $TAG_NAME (Version: $VERSION)"
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

          # Determine target branch (prefer main, fallback to master)
          git fetch origin main:refs/remotes/origin/main 2>/dev/null || true
          git fetch origin master:refs/remotes/origin/master 2>/dev/null || true

          TARGET_BRANCH="main"
          if git show-ref --verify --quiet refs/remotes/origin/main; then
            TARGET_BRANCH="main"
          elif git show-ref --verify --quiet refs/remotes/origin/master; then
            TARGET_BRANCH="master"
          fi
          echo "Target branch: $TARGET_BRANCH"
          echo "target_branch=$TARGET_BRANCH" >> $GITHUB_OUTPUT

          COMMIT_SHA=$(git rev-parse HEAD)
          echo "commit_sha=$COMMIT_SHA" >> $GITHUB_OUTPUT

  build-linux-windows:
    needs: prepare-version
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/tss182/wails3-linux-windows:latest
    env:
      GIT_COMMITTER_NAME: "github-actions[bot]"
      GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}

      - name: Build Linux & Windows
        uses: tss182/action-wails3-linux-windows@v1
        with:
          skip-setup: "true"
          app-name: dhub
          version: ${{ needs.prepare-version.outputs.version }}
          pre-build-command: make update-asset

      - name: Upload Linux & Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-windows-artifacts
          path: |
            bin/dhub_${{ needs.prepare-version.outputs.version }}_linux_amd64.deb
            bin/dhub-${{ needs.prepare-version.outputs.version }}-1.x86_64.rpm
            bin/dhub-${{ needs.prepare-version.outputs.version }}-windows-amd64.exe
            bin/dhub-${{ needs.prepare-version.outputs.version }}-windows-amd64-installer.exe
            bin/dhub-${{ needs.prepare-version.outputs.version }}-windows-arm64.exe
            bin/dhub-${{ needs.prepare-version.outputs.version }}-windows-arm64-installer.exe
          if-no-files-found: error

  build-macos:
    needs: prepare-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.commit_sha }}

      - name: Build macOS
        uses: tss182/action-wails3-macos@v1
        with:
          app-name: dhub
          version: ${{ needs.prepare-version.outputs.version }}
          pre-build-command: make update-asset
          universal: "true"
          zip-app: "false"
          dmg-fail-on-error: "true"

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            bin/dhub-${{ needs.prepare-version.outputs.version }}-macos.dmg
          if-no-files-found: error

  publish-release:
    needs:
      - prepare-version
      - build-linux-windows
      - build-macos
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-release
          merge-multiple: true

      - name: Generate SHA256 Checksums
        run: |
          cd dist-release
          sha256sum * > checksums.txt
          echo "Artifacts to be published in release:"
          ls -lh
          cat checksums.txt

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare-version.outputs.tag_name }}
          name: Release ${{ needs.prepare-version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: dist-release/*

  post-release-sync:
    needs:
      - prepare-version
      - publish-release
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout target branch
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.target_branch }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          check-latest: true

      - name: Install Wails v3 CLI
        run: |
          CGO_ENABLED=0 go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Sync Version across Config, Code, README, and Pages
        run: |
          VERSION="${{ needs.prepare-version.outputs.version }}"
          TARGET_BRANCH="${{ needs.prepare-version.outputs.target_branch }}"

          python3 -c "
          import re
          with open('build/config.yml', 'r') as f:
              content = f.read()
          pattern = r'(info:\s*\n(?:[ \t]+.*\n)*?[ \t]+version:\s*[\"\'\']).*?([\"\'\'][ \t]*(?:#.*)?)'
          new_content = re.sub(pattern, rf'\g<1>${VERSION}\g<2>', content, count=1)
          with open('build/config.yml', 'w') as f:
              f.write(new_content)
          "
          echo "==> Updated build/config.yml with version: $VERSION"

          make update-asset

          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          if git diff --quiet && git diff --staged --quiet; then
            echo "==> No changes detected. Version and README already up-to-date."
          else
            git add -A
            git commit -m "publish: version ${VERSION}"
            git push origin "$TARGET_BRANCH"
          fi

  deploy-pages:
    needs:
      - prepare-version
      - post-release-sync
    if: always() && (needs.post-release-sync.result == 'success' || (github.event_name == 'push' && !startsWith(github.ref, 'refs/tags/v')))
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-version.outputs.target_branch || github.ref_name }}

      - name: Generate Static Releases Data for Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python3 scripts/generate-pages-data.py

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'pages'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
