<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <!-- Monolithic Frosted Obsidian Glass Body of 'D' -->
    <linearGradient id="v2-glass-body" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#1f2536" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#121622" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0a0d14" stop-opacity="0.98" />
    </linearGradient>

    <!-- Glass Surface Specular Highlight -->
    <linearGradient id="v2-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Violet Bevel Accent on Outer Curve -->
    <linearGradient id="v2-violet-rim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Conduits Gradients -->
    <linearGradient id="v2-cyan-conduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <linearGradient id="v2-mid-conduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="v2-bot-conduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Nexus Core Glow Filter -->
    <filter id="v2-nexus-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- ================= MONOLITHIC 'D' BODY ================= -->
  <!-- Outer D Path: Solid Frosted Glass Slab -->
  <path d="M 18 12
           L 56 12
           C 80 12, 94 28, 94 50
           C 94 72, 80 88, 56 88
           L 18 88
           C 14.5 88, 12 85.5, 12 82
           L 12 18
           C 12 14.5, 14.5 12, 18 12 Z"
        fill="url(#v2-glass-body)"
        stroke="#273044"
        stroke-width="1.5" />

  <!-- Diagonal Glass Specular Sheen (Top Half) -->
  <path d="M 18 12
           L 56 12
           C 80 12, 94 28, 94 50
           L 12 50
           L 12 18
           C 12 14.5, 14.5 12, 18 12 Z"
        fill="url(#v2-specular)" />

  <!-- Inner Recessed Counter Cavity -->
  <path d="M 34 30
           L 52 30
           C 66 30, 74 38, 74 50
           C 74 62, 66 70, 52 70
           L 34 70
           C 31.8 70, 30 68.2, 30 66
           L 30 34
           C 30 31.8, 31.8 30, 34 30 Z"
        fill="#0b0e15"
        stroke="#1c2230"
        stroke-width="1.2" />

  <!-- Outer Right Arc Bevel (Violet to Cyan Neon Rim) -->
  <path d="M 56 12
           C 80 12, 94 28, 94 50
           C 94 72, 80 88, 56 88"
        stroke="url(#v2-violet-rim)"
        stroke-width="2.5"
        stroke-linecap="round" />

  <!-- Left Spine Cyan Power Rail -->
  <line x1="12" y1="18" x2="12" y2="82" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" opacity="0.9" />

  <!-- ================= HORIZONTAL GLOWING DATABASE CONDUITS ================= -->
  <!-- Top Conduit (Layer 1) -->
  <path d="M 14 26 L 76 26" stroke="url(#v2-cyan-conduit)" stroke-width="2" stroke-linecap="round" filter="url(#v2-nexus-glow)" />
  <circle cx="14" cy="26" r="2" fill="#ffffff" />
  <circle cx="76" cy="26" r="2" fill="#ffffff" />

  <!-- Middle Conduit (Layer 2 / Hub Data Bridge) -->
  <path d="M 12 50 L 92 50" stroke="url(#v2-mid-conduit)" stroke-width="2.5" stroke-linecap="round" filter="url(#v2-nexus-glow)" />
  <circle cx="12" cy="50" r="2.2" fill="#ffffff" />
  <circle cx="92" cy="50" r="2.2" fill="#ffffff" />

  <!-- Bottom Conduit (Layer 3) -->
  <path d="M 14 74 L 76 74" stroke="url(#v2-bot-conduit)" stroke-width="2" stroke-linecap="round" filter="url(#v2-nexus-glow)" />
  <circle cx="14" cy="74" r="2" fill="#ffffff" />
  <circle cx="76" cy="74" r="2" fill="#ffffff" />

  <!-- ================= CENTRAL NEXUS HUB ================= -->
  <!-- Interlayer Bus Link Line -->
  <line x1="45" y1="26" x2="45" y2="74" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Nexus Core -->
  <circle cx="45" cy="50" r="6.5" fill="#00f2fe" filter="url(#v2-nexus-glow)" />
  <circle cx="45" cy="50" r="2.5" fill="#ffffff" />

  <!-- Pulse Ring -->
  <circle cx="45" cy="50" r="10" stroke="#38bdf8" stroke-width="1" stroke-dasharray="3 2" opacity="0.6" />
</svg>
