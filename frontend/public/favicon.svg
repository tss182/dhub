<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Background Squircle Gradient -->
    <linearGradient id="dhub-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e2230" />
      <stop offset="50%" stop-color="#13151c" />
      <stop offset="100%" stop-color="#0b0d12" />
    </linearGradient>

    <!-- Border Glow Gradient -->
    <linearGradient id="dhub-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#3b82f6" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.1" />
    </linearGradient>

    <!-- Main Vibrant Gradients for D Layers -->
    <linearGradient id="dhub-top-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="dhub-mid-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>

    <linearGradient id="dhub-bot-grad" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <linearGradient id="dhub-hub-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Core Glow Filter -->
    <filter id="dhub-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="ambient-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" />
    </filter>
  </defs>

  <!-- Squircle Container Frame -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#dhub-bg)" />
  <rect x="6" y="6" width="108" height="108" rx="28" stroke="url(#dhub-border)" stroke-width="1.5" />

  <!-- Ambient Backlight -->
  <circle cx="60" cy="60" r="32" fill="#0284c7" opacity="0.22" filter="url(#ambient-glow)" />

  <!-- DHub Monogram: The 3 Database Platters forming 'D' -->
  <!-- Top Platter -->
  <path d="M 32 26 
           L 62 26 
           C 78 26, 88 33, 88 42 
           C 88 43.5, 87.5 44.8, 86.8 46 
           L 32 46 
           C 29.8 46, 28 44.2, 28 42 
           L 28 30 
           C 28 27.8, 29.8 26, 32 26 Z" 
        fill="url(#dhub-top-grad)" />

  <!-- Top Rim Highlight -->
  <path d="M 32 26 L 62 26 C 78 26, 88 33, 88 42" 
        stroke="#e0f2fe" stroke-width="1.2" stroke-linecap="round" opacity="0.75" />

  <!-- Middle Platter (with Hub Conduit Bridge) -->
  <path d="M 28 50 
           L 89 50 
           C 92 53.5, 93 57.5, 93 61 
           C 93 64.5, 92 68.5, 89 72 
           L 28 72 
           C 26.9 72, 26 71.1, 26 70 
           L 26 52 
           C 26 50.9, 26.9 50, 28 50 Z" 
        fill="url(#dhub-mid-grad)" />

  <!-- Middle Platter Rim Highlight -->
  <path d="M 28 50 L 89 50" stroke="#bae6fd" stroke-width="1" opacity="0.6" />

  <!-- Bottom Platter -->
  <path d="M 32 94 
           L 62 94 
           C 78 94, 88 87, 88 78 
           C 88 76.5, 87.5 75.2, 86.8 74 
           L 32 74 
           C 29.8 74, 28 75.8, 28 78 
           L 28 90 
           C 28 92.2, 29.8 94, 32 94 Z" 
        fill="url(#dhub-bot-grad)" />

  <!-- Bottom Rim Highlight -->
  <path d="M 32 94 L 62 94 C 78 94, 88 87, 88 78" 
        stroke="#c7d2fe" stroke-width="1" stroke-linecap="round" opacity="0.5" />

  <!-- Central D Negative Space Hole -->
  <ellipse cx="50" cy="61" rx="13" ry="11" fill="#13151c" />

  <!-- Glowing Hub Nexus Core (Connecting the Database layers) -->
  <circle cx="50" cy="61" r="7" fill="url(#dhub-hub-grad)" filter="url(#dhub-glow)" />
  <circle cx="50" cy="61" r="3.2" fill="#ffffff" />

  <!-- Hub Connection Data Rays / Nodes -->
  <!-- Top Node Connector -->
  <line x1="50" y1="50" x2="50" y2="38" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="37" r="2" fill="#ffffff" />

  <!-- Bottom Node Connector -->
  <line x1="50" y1="72" x2="50" y2="84" stroke="#818cf8" stroke-width="2" stroke-linecap="round" />
  <circle cx="50" cy="85" r="2" fill="#ffffff" />

  <!-- Left Bus Data Points -->
  <circle cx="34" cy="36" r="1.8" fill="#e0f2fe" opacity="0.9" />
  <circle cx="34" cy="61" r="1.8" fill="#e0f2fe" opacity="0.9" />
  <circle cx="34" cy="84" r="1.8" fill="#e0f2fe" opacity="0.9" />
</svg>
