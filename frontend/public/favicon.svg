<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dhub-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d28" />
      <stop offset="50%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>
    <radialGradient id="dhub-badge-glow" cx="22%" cy="18%" r="72%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.16" />
      <stop offset="65%" stop-color="#3b82f6" stop-opacity="0.03" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="dhub-badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.09" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.04" />
    </linearGradient>
    <linearGradient id="dhub-mark-grad" gradientUnits="userSpaceOnUse" x1="188" y1="176" x2="844" y2="848">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="65%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
  </defs>

  <!-- Dimensional Squircle Base Frame -->
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#dhub-badge-bg)" />
  <rect x="32" y="32" width="960" height="960" rx="228" fill="url(#dhub-badge-glow)" />
  <rect x="38" y="38" width="948" height="948" rx="222" stroke="url(#dhub-badge-border)" stroke-width="12" fill="none" />

  <!-- Smooth Concentric Double-D & Layered Database Stack -->
  <g>
    <!-- Outer D -->
    <path
      d="M 188 272 A 96 96 0 0 1 284 176 L 508 176 A 336 336 0 0 1 508 848 L 284 848 A 96 96 0 0 1 188 752 Z"
      fill="none"
      stroke="url(#dhub-mark-grad)"
      stroke-width="44"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Inner D -->
    <path
      d="M 292 332 A 52 52 0 0 1 344 280 L 508 280 A 232 232 0 0 1 508 744 L 344 744 A 52 52 0 0 1 292 692 Z"
      fill="none"
      stroke="url(#dhub-mark-grad)"
      stroke-opacity="0.88"
      stroke-width="38"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- 3-Tier Database Cylinder -->
    <ellipse
      cx="500"
      cy="410"
      rx="122"
      ry="44"
      fill="url(#dhub-mark-grad)"
    />
    <path
      d="M 378 444 A 6 6 0 0 1 390 444 A 110 32 0 0 0 610 444 A 6 6 0 0 1 622 444 L 622 504 A 122 44 0 0 1 378 504 Z"
      fill="url(#dhub-mark-grad)"
      fill-opacity="0.92"
    />
    <path
      d="M 378 538 A 6 6 0 0 1 390 538 A 110 32 0 0 0 610 538 A 6 6 0 0 1 622 538 L 622 598 A 122 44 0 0 1 378 598 Z"
      fill="url(#dhub-mark-grad)"
      fill-opacity="0.82"
    />
  </g>
</svg>
