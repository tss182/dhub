<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="dhub-badge-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14151b" />
      <stop offset="100%" stop-color="#07080a" />
    </linearGradient>
    <linearGradient id="dhub-badge-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3f3f46" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#18181b" stop-opacity="0.4" />
    </linearGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="32" y="32" width="960" height="960" rx="220" fill="url(#dhub-badge-bg)" />
  <rect x="32" y="32" width="960" height="960" rx="220" stroke="url(#dhub-badge-border)" stroke-width="14" fill="none" />

  <!-- Centered Logo Mark -->
  <g transform="translate(164, 164) scale(0.68)">
    <!-- Outer D -->
    <path d="M 21 21 L 512 21 A 491 491 0 0 1 512 1003 L 21 1003 Z" 
          fill="none" stroke="#ffffff" stroke-width="46" stroke-linejoin="miter" />

    <!-- Inner D -->
    <path d="M 245 186 L 512 186 A 326 326 0 0 1 512 838 L 245 838 Z" 
          fill="none" stroke="#ffffff" stroke-width="46" stroke-linejoin="miter" />

    <!-- Cylinder Bottom Disk -->
    <path d="M 336 530 L 336 646 A 176 56 0 0 0 688 646 L 688 530 Z" fill="#ffffff" />

    <!-- Cylinder Top Disk Body & Ellipse -->
    <path d="M 336 380 L 336 530 A 176 56 0 0 0 688 530 L 688 380 Z" fill="#ffffff" />
    <ellipse cx="512" cy="380" rx="176" ry="66" fill="#ffffff" />

    <!-- Divider 2 (between disks) -->
    <path d="M 334 530 A 176 56 0 0 0 690 530" fill="none" stroke="#0b0c10" stroke-width="26" stroke-linecap="round" />

    <!-- Divider 1 (top face rim) -->
    <path d="M 334 410 A 176 56 0 0 0 690 410" fill="none" stroke="#0b0c10" stroke-width="24" stroke-linecap="round" />
  </g>
</svg>