<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%" fill="none">
  <defs>
    <!-- Titanium Obsidian Squircle Base -->
    <linearGradient id="obsidian-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#181c26" />
      <stop offset="45%" stop-color="#0f1118" />
      <stop offset="100%" stop-color="#07080c" />
    </linearGradient>

    <!-- Squircle Border Highlight: Violet-to-Cyan Edge -->
    <linearGradient id="obsidian-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="35%" stop-color="#818cf8" stop-opacity="0.4" />
      <stop offset="70%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#1e2230" stop-opacity="0.3" />
    </linearGradient>

    <!-- Monolithic Frosted Obsidian Glass Body of 'D' -->
    <linearGradient id="glass-d-body" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#1e2433" stop-opacity="0.95" />
      <stop offset="50%" stop-color="#111520" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#090c13" stop-opacity="0.98" />
    </linearGradient>

    <!-- Violet Bevel Accent on Right Outer Arc -->
    <linearGradient id="violet-rim-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <!-- Glowing Conduit Lines -->
    <linearGradient id="cyan-conduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="70%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="mid-conduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#60a5fa" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="bot-conduit" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="70%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>

    <!-- Glass Surface Specular Sheen -->
    <linearGradient id="glass-specular" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Core Nexus Glow Filter -->
    <filter id="nexus-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur1" />
      <feGaussianBlur stdDeviation="6" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Ambient Core Backlight -->
    <radialGradient id="core-ambient" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#obsidian-base)" />
  <rect x="6" y="6" width="116" height="116" rx="30" stroke="url(#obsidian-border)" stroke-width="1.75" />

  <!-- Ambient Violet/Cyan Core Backlight -->
  <circle cx="64" cy="64" r="42" fill="url(#core-ambient)" />

  <!-- ================= MONOLITHIC 'D' BODY ================= -->
  <!-- Outer D Path: Solid Frosted Glass Slab -->
  <path d="M 32 24
           L 66 24
           C 88 24, 102 38, 102 64
           C 102 90, 88 104, 66 104
           L 32 104
           C 28.5 104, 26 101.5, 26 98
           L 26 30
           C 26 26.5, 28.5 24, 32 24 Z"
        fill="url(#glass-d-body)"
        stroke="#232a3a"
        stroke-width="1.5" />

  <!-- Glass Sheen Overlay on Top Half of D -->
  <path d="M 32 24
           L 66 24
           C 88 24, 102 38, 102 64
           L 26 64
           L 26 30
           C 26 26.5, 28.5 24, 32 24 Z"
        fill="url(#glass-specular)" />

  <!-- Inner D Counter Cavity (Recessed Core) -->
  <path d="M 46 42
           L 62 42
           C 74 42, 82 50, 82 64
           C 82 78, 74 86, 62 86
           L 46 86
           C 43.8 86, 42 84.2, 42 82
           L 42 46
           C 42 43.8, 43.8 42, 46 42 Z"
        fill="#0a0c12"
        stroke="#1a1e2b"
        stroke-width="1.2" />

  <!-- Outer Right Arc Bevel Highlight (Violet to Cyan Neon Rim) -->
  <path d="M 66 24
           C 88 24, 102 38, 102 64
           C 102 90, 88 104, 66 104"
        stroke="url(#violet-rim-grad)"
        stroke-width="2.5"
        stroke-linecap="round" />

  <!-- Left Spine Cyan Power Rail -->
  <line x1="26" y1="30" x2="26" y2="98" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" opacity="0.85" />

  <!-- ================= HORIZONTAL GLOWING DATABASE CONDUITS ================= -->
  <!-- Top Conduit (Layer 1) -->
  <path d="M 28 38 L 84 38" stroke="url(#cyan-conduit)" stroke-width="2.2" stroke-linecap="round" filter="url(#nexus-glow)" />
  <circle cx="28" cy="38" r="2.2" fill="#ffffff" />
  <circle cx="84" cy="38" r="2.2" fill="#ffffff" />

  <!-- Middle Conduit (Layer 2 / Hub Line) -->
  <path d="M 26 64 L 100 64" stroke="url(#mid-conduit)" stroke-width="2.5" stroke-linecap="round" filter="url(#nexus-glow)" />
  <circle cx="26" cy="64" r="2.5" fill="#ffffff" />
  <circle cx="100" cy="64" r="2.5" fill="#ffffff" />

  <!-- Bottom Conduit (Layer 3) -->
  <path d="M 28 90 L 84 90" stroke="url(#bot-conduit)" stroke-width="2.2" stroke-linecap="round" filter="url(#nexus-glow)" />
  <circle cx="28" cy="90" r="2.2" fill="#ffffff" />
  <circle cx="84" cy="90" r="2.2" fill="#ffffff" />

  <!-- ================= CENTRAL NEXUS HUB ================= -->
  <!-- Vertical Nexus Spine connecting the 3 Layers -->
  <line x1="56" y1="38" x2="56" y2="90" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.75" />

  <!-- Central Nexus Core in Inner Cavity -->
  <circle cx="56" cy="64" r="7" fill="#00f2fe" filter="url(#nexus-glow)" />
  <circle cx="56" cy="64" r="3" fill="#ffffff" />

  <!-- Radiating Nexus Ring -->
  <circle cx="56" cy="64" r="11" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 2" opacity="0.6" />
</svg>
